# Add inside the existing `server { ... }` block for sumitnarang.com.
# Everything under /jev goes to the Node process; the rest of the site is
# untouched.

location /jev {
    proxy_pass         http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Jev answers land in well under a second; this is only a safety net.
    proxy_read_timeout 30s;
}

# Hashed asset filenames never change contents, so they can be cached hard.
location ~ ^/jev/assets/ {
    proxy_pass     http://127.0.0.1:8787;
    proxy_set_header Host $host;
    add_header     Cache-Control "public, max-age=31536000, immutable";
}
